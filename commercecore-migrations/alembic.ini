[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

# New revisions: 0008_add_something.py  (run: alembic revision -m "add something" --rev-id 0008)
file_template = %%(rev)s_%%(slug)s

# Fallback only. The real URL comes from the DATABASE_URL environment variable (see migrations/env.py).
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/commercecore


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
